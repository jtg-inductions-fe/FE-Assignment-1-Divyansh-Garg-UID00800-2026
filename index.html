<!doctype html>
<html lang="en">
    <head>
        <title>Travlog</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link rel="icon" href="/assets/images/logo.png" />
    </head>
    <body>
        <div class="top-ellipe"></div>

        <header class="site-header">
            <nav class="navbar" aria-label="Main navigation">
                <a href="/" class="navbar__logo">
                    <img
                        src="public/assets/images/logo.png"
                        alt="Travel Point"
                    />
                </a>

                <ul class="navbar__menu" id="mobile-menu">
                    <li class="navbar__item">
                        <a
                            href="/"
                            class="navbar__link navbar__link-active-link"
                            >Home</a
                        >
                    </li>

                    <li class="navbar__item">
                        <a href="#discover" class="navbar__link">Discover</a>
                    </li>

                    <li class="navbar__item">
                        <a href="#special_deals" class="navbar__link"
                            >Special Deals</a
                        >
                    </li>

                    <li class="navbar__item">
                        <a href="#contact" class="navbar__link">Contact</a>
                    </li>

                    <li>
                        <div class="navbar__actions">
                            <a href="/login" class="btn btn--login">Log In</a>
                            <a href="/signup" class="btn btn--signup"
                                >Sign Up</a
                            >
                        </div>
                    </li>
                </ul>

                <div class="navbar__actions">
                    <a href="/login" class="btn btn--login">Log In</a>
                    <a href="/signup" class="btn btn--signup">Sign Up</a>
                </div>

                <button
                    type="button"
                    class="navbar__toggle"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                    aria-controls="mobile-menu"
                >
                    <div>
                        <img
                            src="public/assets/images/hamburger.png"
                            alt="hamburger"
                            aria-hidden="true"
                        />
                    </div>
                </button>
            </nav>
        </header>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
