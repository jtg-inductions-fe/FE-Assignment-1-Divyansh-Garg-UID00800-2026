<!doctype html>
<html lang="en">
    <head>
        <title>Travlog</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link rel="icon" href="/assets/images/logo.png" />
    </head>
    <body>
        <div id="base_container">
            <header class="site-header" id="header">
                <nav class="navbar" aria-label="Main navigation">
                    <a href="/" class="logo navbar__logo">
                        <img
                            src="public/assets/images/logo.png"
                            alt="Travlog"
                            class="logo__img"
                        />
                    </a>

                    <ul
                        class="list navbar__menu"
                        id="mobile-menu"
                        aria-modal="true"
                    >
                        <li class="navbar__item">
                            <a
                                href="/"
                                class="navbar__link navbar__link-active-link"
                                >Home</a
                            >
                        </li>

                        <li class="navbar__item">
                            <a href="#discover" class="navbar__link"
                                >Discover</a
                            >
                        </li>

                        <li class="navbar__item">
                            <a href="#" class="navbar__link spinner__link"
                                >Special Deals</a
                            >
                        </li>

                        <li class="navbar__item">
                            <a href="#contact" class="navbar__link">Contact</a>
                        </li>
                    </ul>

                    <div class="actions navbar__actions">
                        <a href="/login" class="btn btn--secondary">Log In</a>
                        <a href="/signup" class="btn btn--primary">Sign Up</a>
                    </div>

                    <button
                        type="button"
                        class="navbar__toggle"
                        aria-label="Open navigation menu"
                        aria-expanded="false"
                        aria-controls="mobile-menu"
                    >
                        <div>
                            <img
                                src="public/assets/images/hamburger.png"
                                alt="icon for toggling of menu items"
                                aria-hidden="true"
                            />
                        </div>
                    </button>
                </nav>
            </header>
            <main class="site-main" id="special_deals">
                <div class="ellipse-top"></div>
                <section class="hero" aria-labelledby="hero-title">
                    <div class="decor hero__decor hero__decor--left">
                        <span class="icon" aria-hidden="true">&#xf003;</span>
                    </div>

                    <div class="decor hero__decor hero__decor--bottom">
                        <span class="icon" aria-hidden="true">&#xf008;</span>
                    </div>

                    <div class="badge hero__badge">
                        <span class="icon hero__badge-icon" aria-hidden="true"
                            >&#xf00a;</span
                        >
                        <span>Top Places</span>
                    </div>

                    <div class="hero__media">
                        <img
                            src="public/assets/images/globe_with_planes_flying.png"
                            alt=""
                            class="hero__layer"
                            aria-hidden="true"
                        />

                        <div class="hero__image-box">
                            <div class="hero__images hero__images--left">
                                <img
                                    src="public/assets/images/sea_view.png"
                                    alt="A scenic view of a calm blue sea"
                                    class="hero__image"
                                />
                                <img
                                    src="public/assets/images/girl_and_mountains.png"
                                    alt="A women sitting with icey mountains in background"
                                    class="hero__image"
                                />
                            </div>
                            <div class="hero__images hero__images--right">
                                <img
                                    src="public/assets/images/photographer.png"
                                    alt="A photo of a photographer clicking a picture"
                                    class="hero__image hero__image--right"
                                />
                            </div>
                        </div>
                    </div>

                    <div class="content hero__content">
                        <div class="hero__eyebrow">
                            <span>Explore the world!</span>
                            <span
                                class="icon hero__eyebrow-icon"
                                aria-hidden="true"
                                >&#xf007;</span
                            >
                        </div>

                        <header class="header hero__header">
                            <h1 id="hero-title" class="title hero__title">
                                Travel<span class="hero__title-highlight">
                                    top destination </span
                                >of the world
                            </h1>

                            <p class="description hero__description">
                                <span class="hero__description--block"
                                    >We always make our customer happy by
                                    providing</span
                                >
                                as many choices as possible
                            </p>
                        </header>

                        <nav
                            class="actions hero__actions"
                            aria-label="Hero actions"
                        >
                            <a
                                href="#get-started"
                                class="hero__button hero__button--primary"
                            >
                                Get Started
                            </a>

                            <a
                                href="#watch-demo"
                                class="hero__button hero__button--secondary"
                            >
                                <span
                                    class="icon hero__button-icon"
                                    aria-hidden="true"
                                    >&#xf002;</span
                                >
                                <span>Watch Demo</span>
                            </a>
                        </nav>
                    </div>
                </section>
            </main>
            <section class="site-companies" id="all-companies">
                <div class="ellipse-side"></div>
                <img
                    src="public/assets/images/orange_arrows.png"
                    alt="object img"
                    class="arrow-image"
                />
                <div
                    class="companies"
                    id="companies"
                    aria-label="Travel partners"
                >
                    <ul class="list companies__list">
                        <li class="companies__item">
                            <img
                                src="public/assets/images/tripadvisor.png"
                                alt="Tripadvisor"
                                class="companies__logo"
                            />
                        </li>

                        <li class="companies__item">
                            <img
                                src="public/assets/images/expedia.png"
                                alt="Expedia"
                                class="companies__logo"
                            />
                        </li>

                        <li class="companies__item">
                            <img
                                src="public/assets/images/bookings_com.png"
                                alt="Booking.com"
                                class="companies__logo"
                            />
                        </li>

                        <li class="companies__item">
                            <img
                                src="public/assets/images/airbnb.png"
                                alt="Airbnb"
                                class="companies__logo"
                            />
                        </li>

                        <li class="companies__item">
                            <img
                                src="public/assets/images/gabitz.png"
                                alt="Gabitz"
                                class="companies__logo"
                            />
                        </li>
                    </ul>
                </div>
            </section>
        </div>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
